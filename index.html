<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>关键词排名管理系统</title>
<style>
/* ===== 设计基准 =====
   配色克制：主色蓝，辅以中性灰阶；圆角 10px，阴影柔和分层。
   所有颜色集中在 :root，便于统一调整。 */
:root {
  --brand: #2563eb;
  --brand-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --ok: #059669;
  --ok-dark: #047857;
  --danger: #dc2626;
  --danger-dark: #b91c1c;
  --ink: #0f172a;
  --ink-2: #475569;
  --ink-3: #94a3b8;
  --line: #e2e8f0;
  --line-soft: #f1f5f9;
  --bg: #f6f8fb;
  --card: #ffffff;
  --radius: 10px;
  --shadow-sm: 0 1px 2px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.04);
  --shadow-md: 0 4px 12px rgba(15,23,42,.08);
  --shadow-lg: 0 12px 32px rgba(15,23,42,.14);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
               "PingFang SC", "Hiragino Sans GB", sans-serif;
  background: var(--bg); color: var(--ink); min-height: 100vh;
  font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ===== 顶栏 ===== */
.header {
  background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 60%, #3b82f6 100%);
  color: #fff; padding: 14px 28px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 2px 12px rgba(30,58,138,.22);
  position: sticky; top: 0; z-index: 100;
}
.header h1 { font-size: 17px; font-weight: 600; letter-spacing: .3px;
              display: flex; align-items: center; gap: 9px; }
.header h1::before {
  content: ''; width: 4px; height: 18px; border-radius: 2px;
  background: rgba(255,255,255,.85); display: inline-block;
}
.container { max-width: 1440px; margin: 0 auto; padding: 20px 24px 40px; }

/* ===== 卡片 ===== */
.card {
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow-sm); border: 1px solid var(--line);
  padding: 20px; margin-bottom: 16px;
  transition: box-shadow .2s;
}
.card:hover { box-shadow: var(--shadow-md); }
.card-title {
  font-size: 15px; font-weight: 600; margin-bottom: 14px; padding-bottom: 10px;
  border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; gap: 8px;
  color: var(--ink);
}

/* ===== 按钮 ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 15px; border: 1px solid transparent; border-radius: 8px;
  cursor: pointer; font-size: 13.5px; font-family: inherit; font-weight: 500;
  transition: background .16s, border-color .16s, box-shadow .16s, transform .1s;
  white-space: nowrap; line-height: 1.4;
}
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.btn.loading { pointer-events: none; }
.btn-primary { background: var(--brand); color: #fff; box-shadow: 0 1px 2px rgba(37,99,235,.3); }
.btn-primary:hover { background: var(--brand-dark); box-shadow: 0 3px 10px rgba(37,99,235,.32); }
.btn-success { background: var(--ok); color: #fff; box-shadow: 0 1px 2px rgba(5,150,105,.3); }
.btn-success:hover { background: var(--ok-dark); box-shadow: 0 3px 10px rgba(5,150,105,.32); }
.btn-danger { background: var(--danger); color: #fff; box-shadow: 0 1px 2px rgba(220,38,38,.3); }
.btn-danger:hover { background: var(--danger-dark); box-shadow: 0 3px 10px rgba(220,38,38,.32); }
.btn-outline { background: #fff; color: var(--brand); border-color: #c7d7f5; }
.btn-outline:hover { background: var(--brand-soft); border-color: var(--brand); }
.btn-header {
  background: rgba(255,255,255,.14); color: #fff;
  border-color: rgba(255,255,255,.28); backdrop-filter: blur(4px);
}
.btn-header:hover { background: rgba(255,255,255,.26); border-color: rgba(255,255,255,.5); }
.btn-sm { padding: 5px 11px; font-size: 12.5px; border-radius: 7px; }
.btn:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }

/* ===== 表单 ===== */
textarea {
  width: 100%; min-height: 200px; padding: 12px 14px;
  border: 1px solid var(--line); border-radius: 8px;
  font-family: 'SFMono-Regular', Consolas, Monaco, monospace; font-size: 12.5px;
  line-height: 1.6; resize: vertical; color: var(--ink); background: #fcfdff;
  transition: border-color .16s, box-shadow .16s;
}
textarea:focus { outline: none; border-color: var(--brand); background: #fff;
                 box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
input[type="password"], input[type="date"], input[type="text"] {
  padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
  font-size: 14px; font-family: inherit; width: 100%; color: var(--ink);
  background: #fcfdff; transition: border-color .16s, box-shadow .16s;
}
input[type="password"]:focus, input[type="date"]:focus, input[type="text"]:focus {
  outline: none; border-color: var(--brand); background: #fff;
  box-shadow: 0 0 0 3px rgba(37,99,235,.12);
}

/* ===== 导入区（默认收起） ===== */
.import-card { padding: 0; overflow: hidden; }
.import-head {
  display: flex; align-items: center; gap: 9px; padding: 14px 20px;
  cursor: pointer; font-size: 14px; font-weight: 600; user-select: none;
  color: var(--ink); transition: background .16s;
}
.import-head:hover { background: var(--brand-soft); }
.import-head .arrow {
  transition: transform .22s cubic-bezier(.4,0,.2,1);
  font-size: 10px; color: var(--brand);
  display: inline-block; width: 12px; text-align: center;
}
.import-card.open .import-head .arrow { transform: rotate(90deg); }
.import-head .tip {
  font-size: 12px; font-weight: 400; color: var(--ink-3); margin-left: auto;
  padding: 2px 9px; border-radius: 20px; background: var(--line-soft);
}
.import-body { display: none; padding: 0 20px 18px; }
.import-card.open .import-body { display: block; animation: fadeIn .2s ease; }
.import-body textarea { min-height: 150px; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

.row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }

/* ===== 提示条 ===== */
.alert { padding: 11px 15px; border-radius: 8px; margin-bottom: 12px; font-size: 13.5px;
         border-left: 3px solid; display: flex; align-items: center; gap: 8px; }
.alert-warning { background: #fffbeb; color: #92400e; border-color: #f59e0b; }
.alert-success { background: #ecfdf5; color: #065f46; border-color: var(--ok); }
.alert-error   { background: #fef2f2; color: #991b1b; border-color: var(--danger); }
.alert-info    { background: var(--brand-soft); color: #1e40af; border-color: var(--brand); }

/* ===== 产品标签 ===== */
.tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.tab {
  padding: 8px 15px; border: 1px solid var(--line); background: #fff;
  border-radius: 8px; cursor: grab; font-size: 13px; color: var(--ink-2);
  transition: all .16s; position: relative; line-height: 1.35;
}
.tab small { color: var(--ink-3); font-size: 10.5px; }
.tab:hover { background: var(--brand-soft); border-color: #c7d7f5; color: var(--brand); }
.tab:hover small { color: var(--brand); }
.tab.active {
  background: var(--brand); border-color: var(--brand); color: #fff;
  font-weight: 600; box-shadow: 0 3px 10px rgba(37,99,235,.28);
}
.tab.active small { color: rgba(255,255,255,.8); }
.tab:active { cursor: grabbing; }
.tab[draggable="true"] { user-select: none; }

/* ===== 数据预览表 ===== */
.table-container {
  overflow: auto; max-height: 78vh; border-radius: 8px;
  border: 1px solid var(--line); background: #fff;
}
table.preview {
  border-collapse: separate; border-spacing: 0; font-size: 11.5px;
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif; min-width: 100%;
}
table.preview td {
  border-bottom: 1px solid #eef2f7; border-right: 1px solid #eef2f7;
  padding: 5px 9px; white-space: nowrap;
}
table.preview .td-date {
  text-align: center; background: #f8fafc; font-weight: 600; color: var(--ink-2);
  position: sticky; top: 0; z-index: 2;
}
table.preview .td-rank { text-align: left; }
table.preview .td-center { text-align: center; }
table.preview .td-section {
  text-align: left; font-weight: 600; color: #fff; background: var(--brand);
  letter-spacing: .5px;
}
table.preview .row-rank { height: 40px; }
table.preview .row-rank td { background: #fbfdff; }
table.preview .row-normal { height: 27px; }
/* 首列固定，横向滚动时始终可见关键词名。
   注意排除 .td-section：章节标题行是跨列整行，需要保持自己的蓝色底，
   若一起固定会被这里的白色背景覆盖。 */
table.preview td:first-child:not(.td-section) {
  position: sticky; left: 0; z-index: 1; background: #fff;
  box-shadow: 1px 0 0 #eef2f7;
}
table.preview .row-rank td:first-child:not(.td-section) { background: #fbfdff; }
table.preview .td-date:first-child { z-index: 3; }
/* 斑马纹 + 悬停，长表更易读 */
table.preview tbody tr:nth-child(even) td:not(.td-section) { background: #fcfdff; }
.kw-drag:hover td { background: var(--brand-soft) !important; }
.kw-drag td:first-child { cursor: grab; }
/* 关键词名与删除按钮：删除按钮平时淡，悬停才醒目，减少视觉噪音 */
td.kw-cell { text-align: left; }
td.kw-cell .kw-name { display: inline-flex; align-items: center; gap: 6px; }
td.kw-cell .grip { color: var(--ink-3); letter-spacing: -2px; font-size: 12px; }
td.kw-cell .kw-del {
  color: var(--ink-3); cursor: pointer; font-size: 13px; margin-left: 4px;
  padding: 0 3px; border-radius: 4px; transition: color .15s, background .15s;
}
td.kw-cell .kw-del:hover { color: #fff; background: var(--danger); }
tr.kw-drag:hover td.kw-cell .grip { color: var(--brand); }
/* 首列（产品名/ASIN/Rank/关键词）统一加粗并略深，作为行标签更醒目 */
table.preview td.td-prod { font-weight: 600; color: var(--ink); }
table.preview td.td-prod small { font-weight: 400; color: var(--ink-3); font-size: 10px; }
table.preview .row-rank td.td-prod { font-weight: 700; color: var(--brand); }

/* ===== 模态框 ===== */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(15,23,42,.5);
  backdrop-filter: blur(2px); z-index: 1000;
  align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.show { display: flex; animation: fadeIn .16s ease; }
.modal {
  background: #fff; border-radius: 14px; padding: 24px;
  max-width: 600px; width: 100%; box-shadow: var(--shadow-lg);
  max-height: 88vh; overflow-y: auto; animation: popIn .2s cubic-bezier(.34,1.4,.64,1);
}
@keyframes popIn { from { opacity: 0; transform: scale(.96) translateY(8px); } to { opacity: 1; transform: none; } }
.modal h3 { margin-bottom: 12px; font-size: 16px; color: var(--ink); }
.modal p { margin-bottom: 16px; color: var(--ink-2); font-size: 13.5px; }
.modal .conflict-list { max-height: 200px; overflow-y: auto; margin-bottom: 16px; font-size: 13px; }
.modal .conflict-list div { padding: 5px 0; border-bottom: 1px solid var(--line-soft); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

/* ===== 加载与提示 ===== */
.spinner {
  display: inline-block; width: 15px; height: 15px;
  border: 2px solid rgba(255,255,255,.45); border-top-color: #fff;
  border-radius: 50%; animation: spin .65s linear infinite;
}
.spinner.dark { border-color: rgba(37,99,235,.3); border-top-color: var(--brand); }
@keyframes spin { to { transform: rotate(360deg); } }

.topbar { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 99999;
          background: transparent; overflow: hidden; pointer-events: none; }
.topbar::after {
  content: ''; display: block; height: 100%; width: 40%;
  background: linear-gradient(90deg, transparent, #60a5fa, var(--brand), transparent);
  transform: translateX(-100%);
}
.topbar.active::after { animation: slide 1s linear infinite; }
@keyframes slide { to { transform: translateX(350%); } }

.toast {
  position: fixed; top: 18px; right: 18px; z-index: 100000;
  display: flex; align-items: center; gap: 9px;
  padding: 11px 17px; border-radius: 10px; font-size: 13.5px; font-weight: 500;
  color: #fff; background: #1e293b; box-shadow: var(--shadow-lg);
  opacity: 0; transform: translateY(-10px) scale(.97);
  transition: opacity .2s, transform .2s; pointer-events: none; max-width: 340px;
}
.toast.show { opacity: 1; transform: none; }
.toast.ok { background: linear-gradient(135deg, #059669, #10b981); }
.toast.err { background: linear-gradient(135deg, #dc2626, #ef4444); }

.status-bar { font-size: 12.5px; color: var(--ink-3); margin-top: 10px;
              padding-top: 10px; border-top: 1px solid var(--line-soft); }

/* ===== 登录页 ===== */
#loginOverlay { backdrop-filter: blur(6px); }
.login-card {
  background: #fff; border-radius: 16px; box-shadow: var(--shadow-lg);
  padding: 36px 32px; text-align: center; width: 100%; max-width: 400px;
  animation: popIn .26s cubic-bezier(.34,1.4,.64,1);
}
.login-card h2 { margin-bottom: 22px; font-size: 18px; color: var(--ink); }
.login-card .lock-icon {
  width: 52px; height: 52px; margin: 0 auto 16px; border-radius: 14px;
  background: linear-gradient(135deg, var(--brand), #60a5fa);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; box-shadow: 0 6px 18px rgba(37,99,235,.3);
}
.login-card label { color: var(--ink-2) !important; }
.login-card .btn-primary { padding: 11px; font-size: 14.5px; }

/* 滚动条 */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--line-soft); border-radius: 6px; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; border: 2px solid var(--line-soft); }
::-webkit-scrollbar-thumb:hover { background: var(--ink-3); }

/* 窄屏适配 */
@media (max-width: 720px) {
  .header { padding: 12px 16px; flex-wrap: wrap; gap: 10px; }
  .header h1 { font-size: 15px; }
  .container { padding: 14px; }
  .card { padding: 16px; }
  .modal { padding: 20px; }
}
</style>
</head>
<body>

<div class="topbar" id="topbar"></div>
<div class="toast" id="toast"></div>

<div id="loginOverlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:9999;align-items:center;justify-content:center;">
  <div class="login-card">
    <div class="lock-icon">🔐</div>
    <h2>请输入访问密钥</h2>
    <input type="password" id="passwordInput" placeholder="请输入密钥" onkeydown="if(event.key==='Enter')verifyPassword()">
    <div style="margin-top:14px;display:flex;gap:8px;justify-content:center;">
      <label style="font-size:12.5px;display:flex;align-items:center;gap:5px;cursor:pointer;">
        <input type="checkbox" id="rememberPwd" checked> 记住密钥
      </label>
    </div>
    <button class="btn btn-primary" onclick="verifyPassword()" style="margin-top:16px;width:100%;">验证</button>
    <p id="loginError" style="color:var(--danger);font-size:13px;margin-top:10px;display:none;">密钥错误</p>
  </div>
</div>

<div id="mainApp">
<div class="header">
  <h1>关键词排名管理系统</h1>
  <div style="display:flex;gap:8px;">
    <button class="btn btn-header" onclick="refreshData(this)">🔄 刷新数据</button>
    <button class="btn btn-success" onclick="exportExcel(this)">📥 导出全部 Excel</button>
    <button class="btn btn-header" onclick="logout()">🚪 退出登录</button>
  </div>
</div>

<div class="container">
  <div class="card import-card" id="importCard">
    <div class="import-head" onclick="toggleImport()">
      <span class="arrow">▶</span>
      <span>📥 导入 JSON 数据</span>
      <span class="tip" id="importTip">点击展开</span>
    </div>
    <div class="import-body">
      <textarea id="jsonInput" placeholder="粘贴 JSON 数据..."></textarea>
      <div class="row" style="margin-top:12px;">
        <button class="btn btn-primary" id="importBtn" onclick="importData()">📤 提交数据 (直接覆盖)</button>
        <button class="btn btn-outline" onclick="document.getElementById('jsonInput').value=''">✕ 清空</button>
      </div>
      <div id="importStatus" style="margin-top:8px;"></div>
    </div>
  </div>

  <div class="modal-overlay" id="conflictModal">
    <div class="modal">
      <h3>⚠️ 数据冲突检测</h3>
      <p>以下产品/日期已有数据，是否覆盖？</p>
      <div class="conflict-list" id="conflictList"></div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeConflictModal()">取消</button>
        <button class="btn btn-danger" onclick="importData(true)">确认覆盖</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="deleteModal">
    <div class="modal">
      <h3>🗑️ 删除数据</h3>
      <p id="deleteMsg"></p>
      <div id="deleteDateContainer" style="margin-bottom:16px;max-height:400px;overflow-y:auto;"></div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeDeleteModal()">取消</button>
        <button class="btn btn-danger" id="deleteConfirmBtn">确认删除</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">📋 数据预览</div>
    <div class="tabs" id="productTabs"></div>
    <div class="table-container" id="previewTable"></div>
    <div class="status-bar" id="statusBar"></div>
  </div>
</div>
</div>

<script src="/app.js"></script>
</body>
</html>
